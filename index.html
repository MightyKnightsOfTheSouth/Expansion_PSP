<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psi Sigma Phi Chapter & Expansion Map</title>

    <!-- Tab Favicon-->
    <link rel="icon" type="image/png" href="images/pspshield.png">

            <!-- Google Fonts: Playfair Display (250 weight)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- Header Section-->
    <header class="app-header">
        <div class="header-logo-container">
            <img class="header-logo" src="images/pspsword.png" alt="Psi Sigma Phi Logo">
        </div>
        <h1 class="header-title">Psi Sigma Phi Expansion and Retention Project</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="app-container">
        <!-- Left Side Interactive Sidebar-->
        <aside class="sidebar collapsed" id="sidebar">
            <button class="toggle-sidebar-btn" id="sidebarToggle" title="Toggle Sidebar">➔</button>
            <div class="sidebar-header">
                <input type="text" id="searchInput" class="search-box" placeholder="Search chapter, university, or city...">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="existing">Existing</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="inactive">Inactive</button>
                    <button class="filter-btn" data-filter="expansion">Expansion</button>
                  
                </div>
            </div>
            <div class="sidebar-list" id="sidebarList">
                <!-- Dynamically populated-->
            </div>
        </aside>

        <div class="map-wrapper">
            <div id="map"></div>
            <footer class="map-footer">
                © 2026 Psi Sigma Phi Multicultural Fraternity, Inc. | Multicultural by birth, not by choice. | Breaking social fears and ignorance.
            </footer>
        </div>
    </div>

    <!-- Global Hover Preview Card-->
    <div id="global-hover-card"></div>

    <!-- Leaflet JS Library-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/colleges.js"></script>
    <script src="js/map.js"></script>
    <script src="js/sidebar.js"></script>
    
    <script>


const sidebarList = document.getElementById('sidebarList');
const searchInput = document.getElementById('searchInput');
const filterButtons = document.querySelectorAll('.filter-btn');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');

      
sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    sidebarToggle.innerText = sidebar.classList.contains('collapsed') ? '➔' : '❮';
});

      
        function renderSidebar() {
            const query = searchInput.value.toLowerCase().trim();
            sidebarList.innerHTML = '';

            collegiateData.forEach(college => {
                const matchesSearch = college.name.toLowerCase().includes(query) ||
                                      college.subtitle.toLowerCase().includes(query) ||
                                      college.locationName.toLowerCase().includes(query);

let matchesFilter = false;

if (currentFilter === 'all') {
    matchesFilter = true;
}
else if (currentFilter === 'existing') {
    matchesFilter = college.exists === true;
}
else if (currentFilter === 'active') {
    matchesFilter = college.exists === true && college.active === true;
}
else if (currentFilter === 'inactive') {
    matchesFilter = college.exists === true && college.active === false;
}
else if (currentFilter === 'expansion') {
    matchesFilter = college.exists === false;
}

const isVisible = matchesSearch && matchesFilter;
const markerObj = markerMap.get(college.id);

if (isVisible || currentFilter === 'all') {

    if (!map.hasLayer(markerObj.marker)) {
        markerObj.marker.addTo(map);
    }

    const card = document.createElement('div');
    card.className = 'sidebar-card';
    card.id = `sidebar-card-${college.id}`;
    card.innerHTML = getSidebarCardHtml(college);

    card.addEventListener('click', () => {
        focusLocation(college, true);
    });

    sidebarList.appendChild(card);

} else if (currentFilter !== 'all') {

    if (map.hasLayer(markerObj.marker)) {
        map.removeLayer(markerObj.marker);
    }

}
            });
        }

        function focusLocation(college, triggerPopup = true) {
            const targetZoom = 13;
            const markerObj = markerMap.get(college.id);

            const latLng = L.latLng(college.coordinates);
            const containerHeight = map.getSize().y;
            const yOffset = (0.80- 0.50) * containerHeight;

            const pinPoint = map.project(latLng, targetZoom);
            const targetPoint = L.point(pinPoint.x, pinPoint.y- yOffset);
            const targetLatLng = map.unproject(targetPoint, targetZoom);

            map.flyTo(targetLatLng, targetZoom, {
                duration: 1.2
            });

            document.querySelectorAll('.sidebar-card').forEach(c => c.classList.remove('active-card'));
            const selectedCard = document.getElementById(`sidebar-card-${college.id}`);
            if (selectedCard) {
                selectedCard.classList.add('active-card');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (triggerPopup && markerObj) {
    markerObj.marker.openPopup();
            }
        }
    
        
        searchInput.addEventListener('input', renderSidebar);

        filterButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderSidebar();
            });
        });

        renderSidebar();
    </script>
</body>
</html>
