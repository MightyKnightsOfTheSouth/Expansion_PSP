<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psi Sigma Phi Chapter & Expansion Map</title>

    <!-- Tab Favicon-->
    <link rel="icon" type="image/png" href="images/pspshield.png">

            <!-- Google Fonts: Playfair Display (250 weight)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

<!-- Header Section-->
<header class="app-header">
    <div class="header-logo-container">
        <a href="https://mightyknightsofthesouth.github.io/PSP-existing-expansion/" target="_blank">
            <img class="header-logo" src="images/pspsword.png" alt="Psi Sigma Phi Logo">
        </a>
    </div>

    <h1 class="header-title">Psi Sigma Phi Expansion & Retention Project</h1>

    <div class="header-spacer"></div>
</header>

    <div class="app-container">
        <!-- Left Side Interactive Sidebar-->
        <aside class="sidebar collapsed" id="sidebar">
<button 
class="toggle-sidebar-btn" 
id="sidebarToggle" 
title="Toggle Sidebar">
➔
</button>
            <div class="sidebar-header">
                <input type="text" id="searchInput" class="search-box" placeholder="Search chapter, university, state, or city...">
<div class="filter-tabs">

    <button class="filter-btn all-filter" data-filter="all">
        All
    </button>

    <div class="filter-row">
        <button class="filter-btn" data-filter="active">
            Active
        </button>

        <button class="filter-btn" data-filter="inactive">
            Inactive
        </button>
    </div>

    <div class="filter-row">
        <button class="filter-btn" data-filter="existing">
            Existing
        </button>

        <button class="filter-btn" data-filter="expansion">
            Expansion
        </button>
    </div>

</div>

<div class="selection-controls">

    <button id="clearSelectionBtn">
        Clear Selection
    </button>

    <div id="selectedCount">
        Selected: 0
    </div>

</div>
                
            </div>
            <div class="sidebar-list" id="sidebarList">
                <!-- Dynamically populated-->
            </div>
        </aside>

<div class="map-wrapper">
    <div id="map"></div>

    <!-- Map Legend -->
    <div class="map-legend">

        <div class="legend-item">
            <span class="legend-circle active"></span>
            <span>Active</span>
        </div>

        <div class="legend-item">
            <span class="legend-circle inactive"></span>
            <span>Inactive</span>
        </div>

        <div class="legend-item">
            <span class="legend-circle expansion"></span>
            <span>Expansion</span>
        </div>
        
    </div>

    <footer class="map-footer">
        © 2026 
        <a href="https://psisigmaphi.org" target="_blank">
            Psi Sigma Phi Multicultural Fraternity, Inc.
        </a>
        | Multicultural by birth, not by choice. | Breaking social fears and ignorance.
    </footer>
</div>
    </div>

    <!-- Global Hover Preview Card-->
    <div id="global-hover-card"></div>

    <!-- Leaflet JS Library-->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/data/chapters.js"></script>
<script src="js/data/expansion/north-carolina.js"></script>
<script src="js/data/data.js"></script>


<script src="js/map.js"></script>
<script src="js/markers.js"></script>
<script src="js/popup.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
