<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psi Sigma Phi Chapter & Expansion Map</title>

    <!-- Tab Favicon-->
    <link rel="icon" type="image/png" href="images/pspshield.png">

            <!-- Google Fonts: Playfair Display (250 weight)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- Header Section-->
    <header class="app-header">
        <div class="header-logo-container">
            <img class="header-logo" src="images/pspsword.png" alt="Psi Sigma Phi Logo">
        </div>
        <h1 class="header-title">Psi Sigma Phi Expansion and Retention Project</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="app-container">
        <!-- Left Side Interactive Sidebar-->
        <aside class="sidebar collapsed" id="sidebar">
            <button class="toggle-sidebar-btn" id="sidebarToggle" title="Toggle Sidebar">➔</button>
            <div class="sidebar-header">
                <input type="text" id="searchInput" class="search-box" placeholder="Search chapter, university, or city...">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="existing">Existing</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="inactive">Inactive</button>
                    <button class="filter-btn" data-filter="expansion">Expansion</button>
                  
                </div>
            </div>
            <div class="sidebar-list" id="sidebarList">
                <!-- Dynamically populated-->
            </div>
        </aside>

        <div class="map-wrapper">
            <div id="map"></div>
            <footer class="map-footer">
                © 2026 Psi Sigma Phi Multicultural Fraternity, Inc. | Multicultural by birth, not by choice. | Breaking social fears and ignorance.
            </footer>
        </div>
    </div>

    <!-- Global Hover Preview Card-->
    <div id="global-hover-card"></div>

    <!-- Leaflet JS Library-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Geographical center of the US is 39.8283,-98.5795
        const map = L.map('map', {
            center: [37.3,-77.8],
            zoom: 5,
            minZoom: 3
        });

        // Dark-themed map canvas layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const hoverCard = document.getElementById('global-hover-card');

        // Complete official chapter list
        const collegiateData = [
            {
                id: "kappa",
                name: "University of North Carolina at Chapel Hill",
                subtitle: "Cryptik Kappa Chapter",
                exists: true,
                active: false,
                founded: "October 31, 2003",
                locationName: "103 South Building, Chapel Hill, North Carolina",
                coordinates: [35.9049,-79.0469],
                logo: "images/pspshield.png",
                bio: "Cryptik Kappa Chapter established at UNC Chapel Hill.",
                mapsLink: "https://maps.google.com/?q=103+South+Building,+Chapel+Hill,+North+Carolina"
            },
            {
                id: "mu",
                name: "University of North Carolina at Charlotte",
                subtitle: "Valiant Mu Chapter",
                exists: true,
                active: true,
                founded: "July 15, 2007",
                locationName: "9201 University City Blvd, Charlotte, North Carolina",
                coordinates: [35.3071,-80.7352],
                logo: "images/pspshield.png",
                bio: "Active chapter fostering leadership and brotherhood at UNC Charlotte.",
                mapsLink: "https://maps.google.com/?q=9201+University+City+Blvd,+Charlotte,+North+Carolina"
            },
            {
                id: "pi",
                name: "University of North Carolina at Greensboro",
                subtitle: "Prodigal Pi Chapter",
                exists: true,
                active: true,
                founded: "November 30, 2010",
                locationName: "203 Foust Building, Greensboro, North Carolina",
                coordinates: [36.0682,-79.8102],
                logo: "images/pspshield.png",
                bio: "Active pillar chapter driving multicultural leadership at UNC Greensboro.",
                mapsLink: "https://maps.google.com/?q=203+Foust+Building,+Greensboro,+North+Carolina"
            },
            
            // =========================
            // Expansion Institutions
            // =========================

            {
                id: "ncatsu",
                name: "North Carolina Agricultural and Technical State University",
                subtitle: "Expansion Candidate",
                exists: false,
                active: false,
                founded: "",
                locationName: "1601 East Market Street, Greensboro, North Carolina",
                coordinates: [36.0756,-79.7745],
                logo: "images/pspexpansion.PNG",
                bio: "Largest historically Black university in the United States.",
                mapsLink: "https://maps.google.com/?q=1601+East+Market+Street,+Greensboro,+North+Carolina"
            },
    {
        id: "guilford",
        name: "Guilford College",
        subtitle: "Minimal / No Greek Life",
        exists: false,
        active: false,
        founded: "",
        locationName: "5800 West Friendly Avenue, Greensboro, North Carolina",
        coordinates: [36.0927,-79.8920],
        logo: "images/pspexpansion.PNG",
        bio: "Private liberal arts college in Greensboro with minimal Greek life.",
        mapsLink: "https://maps.google.com/?q=5800+West+Friendly+Avenue,+Greensboro,+North+Carolina"
    }, 
        ];

        const markerMap = new Map();
        let currentFilter = 'all';
        
        function getSidebarCardHtml(college) {
            const statusBadgeText = college.exists ? (college.active ? 'Existing • Active' : 'Existing • Inactive') : 'Expansion';
            const statusClass = college.exists ? (college.active ? 'active-status' : 'inactive-status') : 'expansion';

            return `
                <div class="card-header-line">
                    <div class="card-title">${college.name}</div>
                    <span class="status-badge ${statusClass}">${statusBadgeText}</span>
                </div>
                <div class="card-subtitle">${college.subtitle}</div>
                <div class="card-location">📍 ${college.locationName}</div>
            `;
        }

        function getDetailProfileHtml(college) {
            const statusText = college.exists ? 'Existing' : 'Expansion';
            const statusClass = college.exists ? (college.active ? 'active-status' : 'inactive-status') : 'expansion';

            let statusBadgesHtml = `
                <div class="profile-status-bar">
                    <span class="status-badge ${statusClass}">${statusText}</span>
            `;

            if (college.exists) {
                const activityText = college.active ? 'Active' : 'Inactive';
                const activityClass = college.active ? 'active-status' : 'inactive-status';
                statusBadgesHtml += `<span class="status-badge ${activityClass}">${activityText}</span>`;
            }

            statusBadgesHtml += `</div>`;

            let html = `
                ${statusBadgesHtml}
                <div class="logo-container">
                    <img class="logo-img" src="${college.logo}" alt="${college.name}">
                </div>
                <h3 class="profile-header">${college.name}</h3>
                <div class="profile-subtitle">${college.subtitle}</div>
            `;

            if (college.exists && college.founded) {
                html += `
                    <div class="profile-section">
                        <div class="profile-label">Founded</div>
                        <div class="profile-value">${college.founded}</div>
                    </div>
                `;
            }

            html += `
                <div class="profile-section">
                    <div class="profile-label">Institution</div>
                    <div class="profile-value">${college.name}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">Location</div>
                    <div class="profile-value">${college.locationName}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">About</div>
                    <div class="profile-value">${college.bio}</div>
                </div>
                <a href="${college.mapsLink}" target="_blank" class="directions-btn">📍 Get Directions</a>
            `;

            return html;
        }

        collegiateData.forEach(college => {

    let markerImg;
    let pinBgColor;
    let pinBorderColor;

    if (college.exists === false) {
        // Expansion candidate
        markerImg = 'images/pspexpansion.PNG';
        pinBgColor = '#4b5563';
        pinBorderColor = '#374151';

    } else if (college.exists === true && college.active === true) {
        // Existing active chapter
        markerImg = 'images/pspexists.png';
        pinBgColor = '#15803d';
        pinBorderColor = '#166534';

    } else {
        // Existing inactive chapter
        markerImg = 'images/pspexists.png';
        pinBgColor = '#780606';
        pinBorderColor = '#500404';
    }

    const customIcon = L.divIcon({
        html: `
            <div class="custom-pin-container" style="--pin-bg:${pinBgColor};--pin-border:${pinBorderColor};">
                <div class="custom-pin-head" 
                     style="background-image:url('${markerImg}'); background-color:${pinBgColor};">
                </div>
            </div>
        `,
        className: '',
        iconSize: [42,50],
        iconAnchor: [21,50]
    });
            const marker = L.marker(college.coordinates, { icon: customIcon });
            markerMap.set(college.id, { marker, data: college });

            marker.bindPopup(getDetailProfileHtml(college), {
                direction: 'auto',
                offset: [0,-20],
                closeButton: false,
                autoPan: false
            });

            marker.on('click', () => {
                focusLocation(college);
            });

            marker.on('mouseover', (e) => {
                hoverCard.innerHTML = getSidebarCardHtml(college);
                hoverCard.style.display = 'block';
                updateHoverPosition(e.originalEvent);
            });

            marker.on('mousemove', (e) => {
                updateHoverPosition(e.originalEvent);
            });

            marker.on('mouseout', () => {
                hoverCard.style.display = 'none';
            });

            marker.on('popupopen', () => {
                hoverCard.style.display = 'none';
            });
        });

        function updateHoverPosition(e) {
            const padding = 20;
            const cardWidth = hoverCard.offsetWidth || 280;
            const cardHeight = hoverCard.offsetHeight || 120;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            let left = e.clientX + 15;
            let top = e.clientY- 20;

            if (left + cardWidth > viewportWidth- padding) {
                left = e.clientX- cardWidth- 15;
            }

            if (top + cardHeight > viewportHeight- padding) {
                top = viewportHeight- cardHeight- padding;
            }

            if (top < padding) {
                top = padding;
            }

            hoverCard.style.left = `${left}px`;
            hoverCard.style.top = `${top}px`;
        }

const sidebarList = document.getElementById('sidebarList');
const searchInput = document.getElementById('searchInput');
const filterButtons = document.querySelectorAll('.filter-btn');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');

      
sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    sidebarToggle.innerText = sidebar.classList.contains('collapsed') ? '➔' : '❮';
});

      
        function renderSidebar() {
            const query = searchInput.value.toLowerCase().trim();
            sidebarList.innerHTML = '';

            collegiateData.forEach(college => {
                const matchesSearch = college.name.toLowerCase().includes(query) ||
                                      college.subtitle.toLowerCase().includes(query) ||
                                      college.locationName.toLowerCase().includes(query);

let matchesFilter = false;

if (currentFilter === 'all') {
    matchesFilter = true;
}
else if (currentFilter === 'existing') {
    matchesFilter = college.exists === true;
}
else if (currentFilter === 'active') {
    matchesFilter = college.exists === true && college.active === true;
}
else if (currentFilter === 'inactive') {
    matchesFilter = college.exists === true && college.active === false;
}
else if (currentFilter === 'expansion') {
    matchesFilter = college.exists === false;
}

const isVisible = matchesSearch && matchesFilter;
const markerObj = markerMap.get(college.id);

if (isVisible || currentFilter === 'all') {

    if (!map.hasLayer(markerObj.marker)) {
        markerObj.marker.addTo(map);
    }

    const card = document.createElement('div');
    card.className = 'sidebar-card';
    card.id = `sidebar-card-${college.id}`;
    card.innerHTML = getSidebarCardHtml(college);

    card.addEventListener('click', () => {
        focusLocation(college, true);
    });

    sidebarList.appendChild(card);

} else if (currentFilter !== 'all') {

    if (map.hasLayer(markerObj.marker)) {
        map.removeLayer(markerObj.marker);
    }

}
            });
        }

        function focusLocation(college, triggerPopup = true) {
            const targetZoom = 13;
            const markerObj = markerMap.get(college.id);

            const latLng = L.latLng(college.coordinates);
            const containerHeight = map.getSize().y;
            const yOffset = (0.80- 0.50) * containerHeight;

            const pinPoint = map.project(latLng, targetZoom);
            const targetPoint = L.point(pinPoint.x, pinPoint.y- yOffset);
            const targetLatLng = map.unproject(targetPoint, targetZoom);

            map.flyTo(targetLatLng, targetZoom, {
                duration: 1.2
            });

            document.querySelectorAll('.sidebar-card').forEach(c => c.classList.remove('active-card'));
            const selectedCard = document.getElementById(`sidebar-card-${college.id}`);
            if (selectedCard) {
                selectedCard.classList.add('active-card');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (triggerPopup && markerObj) {
    markerObj.marker.openPopup();
            }
        }
    
        
        searchInput.addEventListener('input', renderSidebar);

        filterButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderSidebar();
            });
        });

        renderSidebar();
    </script>
</body>
</html>
